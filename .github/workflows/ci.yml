name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check skills tests tools
      - run: pytest -q --ignore=tests/test_examples.py
      - name: Runs from the skill folder without installing
        run: python3 skills/leakage-audit/scripts/run_unleak.py check tests/cases/clean_pipeline_cv.py

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]" scikit-learn imbalanced-learn lightgbm xgboost
      - run: pytest -q tests/test_examples.py
      - run: python examples/run_all.py 1

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate the Claude Code plugin and marketplace
        run: npx -y @anthropic-ai/claude-code plugin validate . --strict
